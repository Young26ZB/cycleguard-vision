# NMS-Free YOLO11 for High-Density Electric Bicycle Detection
# Features:
#   - End-to-end detection (no NMS post-processing)
#   - Dual Label Assignment (One-to-Many + One-to-One)
#   - DySample dynamic upsampling
#   - SimAM parameter-free attention
#   - Repulsion Loss for crowded scenes

# Parameters
nc: 1  # number of classes (electric bicycle)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # nano
  s: [0.50, 0.50, 1024]  # small
  m: [0.50, 1.00, 512]   # medium
  l: [1.00, 1.00, 512]   # large
  x: [1.00, 1.50, 512]   # xlarge

# Backbone with SimAM attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, SimAM, []]                  # 3 - Attention after P2
  - [-1, 1, Conv, [256, 3, 2]]          # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 5
  - [-1, 1, SimAM, []]                  # 6 - Attention after P3
  - [-1, 1, Conv, [512, 3, 2]]          # 7-P4/16
  - [-1, 2, C3k2, [512, True]]          # 8
  - [-1, 1, SimAM, []]                  # 9 - Attention after P4
  - [-1, 1, Conv, [1024, 3, 2]]         # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 11
  - [-1, 1, SPPF, [1024, 5]]            # 12
  - [-1, 2, C2PSA, [1024]]              # 13
  - [-1, 1, SimAM, []]                  # 14 - Attention after P5

# Head with DySample upsampling
head:
  - [-1, 1, DySample, [2]]                        # 15 - Dynamic upsample x2
  - [[-1, 9], 1, Concat, [1]]                     # 16 - cat backbone P4
  - [-1, 2, C3k2, [512, False]]                   # 17

  - [-1, 1, DySample, [2]]                        # 18 - Dynamic upsample x2
  - [[-1, 6], 1, Concat, [1]]                     # 19 - cat backbone P3
  - [-1, 2, C3k2, [256, False]]                   # 20 (P3/8-small)
  - [-1, 1, SimAM, []]                            # 21 - Attention

  - [-1, 1, Conv, [256, 3, 2]]                    # 22
  - [[-1, 17], 1, Concat, [1]]                    # 23 - cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 24 (P4/16-medium)
  - [-1, 1, SimAM, []]                            # 25 - Attention

  - [-1, 1, Conv, [512, 3, 2]]                    # 26
  - [[-1, 14], 1, Concat, [1]]                    # 27 - cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 28 (P5/32-large)
  - [-1, 1, SimAM, []]                            # 29 - Attention

  - [[21, 25, 29], 1, Detect, [nc, True]]         # 30 - Detect(P3, P4, P5) with end2end=True
